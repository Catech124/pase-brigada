<!DOCTYPE html>
<html lang="es" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PASE · diagnóstico de contratación</title>
<meta name="description" content="Cruza el perfil de tus puestos con tus candidatos y ordena qué vacante cubrir primero y con quién.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%232c6a4e'/%3E%3Cpath d='M10 24V8h8a5.5 5.5 0 0 1 0 11h-4v5z' fill='%23f2f3f0'/%3E%3C/svg%3E">
<meta name="theme-color" content="#f2f3f0" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0d100e" media="(prefers-color-scheme: dark)">
<link rel="stylesheet" href="assets/styles.css">
</head>
<body>

<header class="top">
  <div class="top-left">
    <span class="brand"><b>PASE</b></span>
    <span class="crumb-sep">/</span>
    <span class="workspace" id="topEmpresa">—</span>
  </div>
  <div class="top-actions">
    <button class="btn btn--sm" type="button" data-export="download" title="Descarga el diagnóstico en Markdown">Informe</button>
    <button class="icon-btn" type="button" data-tema="toggle" aria-label="Cambiar entre tema claro y oscuro">
      <svg class="ico ico-moon" viewBox="0 0 16 16" aria-hidden="true"><path d="M13.5 9.5A6 6 0 0 1 6.5 2.5a6 6 0 1 0 7 7z"/></svg>
      <svg class="ico ico-sun" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="3.2"/><path d="M8 1.4v2.2M8 12.4v2.2M1.4 8h2.2M12.4 8h2.2M3.3 3.3l1.6 1.6M11.1 11.1l1.6 1.6M12.7 3.3l-1.6 1.6M4.9 11.1l-1.6 1.6"/></svg>
    </button>
  </div>
</header>

<div class="shell">
  <nav class="rail" aria-label="Secciones">
    <div class="nav" id="nav">
      <button type="button" data-nav="resumen" aria-current="page">Resumen</button>
      <button type="button" data-nav="puestos">Puestos</button>
      <button type="button" data-nav="candidatos">Candidatos</button>
      <button type="button" data-nav="matriz">Matriz</button>
    </div>
    <div class="nav nav--sub" id="navSub">
      <button type="button" data-nav="datos">Datos</button>
      <button type="button" data-nav="metodo">Método</button>
    </div>
    <div class="ws-foot">
      <span class="ws-meta" id="wsMeta">—</span>
      <span class="ws-badge" id="wsBadge" title="Contenido ficticio de demostración">Datos de ejemplo</span>
    </div>
  </nav>

  <main class="main">
    <div id="vista" class="view" tabindex="-1"></div>
  </main>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="assets/data.js"></script>
<script src="assets/engine.js"></script>
<script src="assets/app.js"></script>
</body>
</html>
